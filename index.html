<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Cheese 🧀</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px;
        }

        #gameContainer {
            position: relative;
            width: 500px;
            height: 700px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            border: 5px solid #333;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        #cheese {
            position: absolute;
            width: 50px;
            height: 50px;
            font-size: 50px;
            line-height: 50px;
            left: 60px;
            top: 300px;
            user-select: none;
            z-index: 5;
        }

        .pipe {
            position: absolute;
            width: 70px;
            background: linear-gradient(90deg, #8B7355 0%, #D2B48C 50%, #8B7355 100%);
            border: 3px solid #654321;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .pipe-top {
            top: 0;
        }

        .pipe-bottom {
            bottom: 0;
        }

        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            z-index: 10;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 16px;
            border-radius: 8px;
        }

        #bestScore {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 16px;
            color: #333;
            z-index: 10;
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 12px;
            border-radius: 8px;
        }

        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        #gameOverScreen h1 {
            color: #FFD700;
            font-size: 50px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        #gameOverScreen p {
            color: white;
            font-size: 20px;
            margin-bottom: 20px;
        }

        #restartBtn {
            padding: 12px 30px;
            font-size: 18px;
            background: #FFD700;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #restartBtn:hover {
            background: #FFC700;
        }

        #backMenuBtn {
            padding: 10px 25px;
            font-size: 16px;
            background: #666;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #backMenuBtn:hover {
            background: #888;
        }

        #countdownScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        #countdownNumber {
            color: #FFD700;
            font-size: 100px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
        }

        #startText {
            color: white;
            font-size: 24px;
            margin-top: 20px;
        }

        #modeSelectScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 25;
            color: white;
            text-align: center;
            padding: 30px;
        }

        #modeSelectScreen h1 {
            font-size: 40px;
            margin-bottom: 25px;
            color: #FFD700;
        }

        #modeSelectScreen p {
            font-size: 16px;
            margin-bottom: 30px;
            color: #DDD;
        }

        .modeButton {
            width: 280px;
            padding: 14px;
            font-size: 16px;
            margin-bottom: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            color: white;
        }

        .modeButton:hover {
            transform: scale(1.05);
        }

        #noobBtn {
            background: #4CAF50;
        }

        #noobBtn:hover {
            background: #45a049;
        }

        #easyBtn {
            background: #2196F3;
        }

        #easyBtn:hover {
            background: #0b7dda;
        }

        #normalBtn {
            background: #FF9800;
        }

        #normalBtn:hover {
            background: #e68900;
        }

        #hardBtn {
            background: #f44336;
        }

        #hardBtn:hover {
            background: #da190b;
        }

        #superBtn {
            background: linear-gradient(45deg, #FF1493, #FFD700);
            font-size: 15px;
        }

        #superBtn:hover {
            transform: scale(1.05) rotate(2deg);
        }

        #currentMode {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #FFD700;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 14px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="score">Score: 0</div>
        <div id="bestScore">Best: 0</div>
        <div id="currentMode">Mode: -</div>
        <div id="cheese">🧀</div>
        
        <div id="modeSelectScreen">
            <h1>FLAPPY CHEESE</h1>
            <p>Select Difficulty:</p>
            <button class="modeButton" id="noobBtn">NOOB</button>
            <button class="modeButton" id="easyBtn">EASY</button>
            <button class="modeButton" id="normalBtn">NORMAL</button>
            <button class="modeButton" id="hardBtn">HARD</button>
            <button class="modeButton" id="superBtn">XTREME</button>
        </div>

        <div id="countdownScreen">
            <div id="countdownNumber">3</div>
            <div id="startText">Get Ready!</div>
        </div>

        <div id="gameOverScreen">
            <h1>GAME OVER!</h1>
            <p id="finalScore">Score: 0</p>
            <p id="bestScoreDisplay">Best: 0</p>
            <button id="restartBtn">Play Again</button>
            <button id="backMenuBtn">Back to Menu</button>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('gameContainer');
        const cheese = document.getElementById('cheese');
        const scoreDisplay = document.getElementById('score');
        const bestScoreDisplay = document.getElementById('bestScore');
        const currentModeDisplay = document.getElementById('currentMode');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const countdownScreen = document.getElementById('countdownScreen');
        const modeSelectScreen = document.getElementById('modeSelectScreen');
        const countdownNumber = document.getElementById('countdownNumber');
        const finalScoreDisplay = document.getElementById('finalScore');
        const bestScoreEndDisplay = document.getElementById('bestScoreDisplay');
        const restartBtn = document.getElementById('restartBtn');
        const backMenuBtn = document.getElementById('backMenuBtn');

        let cheeseY = 300;
        let cheeseVelocity = 0;
        let score = 0;
        let bestScore = localStorage.getItem('cheeseBest') ? parseInt(localStorage.getItem('cheeseBest')) : 0;
        let gameRunning = false;
        let gameOver = false;
        let pipes = [];
        const containerWidth = 500;
        const containerHeight = 700;
        let currentMode = '';
        
        let modeSettings = {
            noob: { gravity: 0.3, jumpPower: -10, pipeGap: 180, pipeSpeed: 2, label: "NOOB" },
            easy: { gravity: 0.45, jumpPower: -11, pipeGap: 140, pipeSpeed: 3, label: "EASY" },
            normal: { gravity: 0.6, jumpPower: -12, pipeGap: 110, pipeSpeed: 5, label: "NORMAL" },
            hard: { gravity: 0.75, jumpPower: -13, pipeGap: 90, pipeSpeed: 6.5, label: "HARD" },
            superhardXtremedeluxe2000: { gravity: 1.0, jumpPower: -14, pipeGap: 70, pipeSpeed: 8, label: "XTREME" }
        };

        bestScoreDisplay.textContent = 'Best: ' + bestScore;

        function selectMode(mode) {
            currentMode = mode;
            const settings = modeSettings[mode];
            currentModeDisplay.textContent = 'Mode: ' + settings.label;
            modeSelectScreen.style.display = 'none';
            countdownScreen.style.display = 'flex';
            startCountdown();
        }

        function startCountdown() {
            let count = 3;
            countdownNumber.textContent = count;
            
            const countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownNumber.textContent = count;
                } else {
                    clearInterval(countInterval);
                    countdownScreen.style.display = 'none';
                    gameRunning = true;
                    gameLoop();
                }
            }, 1000);
        }

        function createPipe() {
            const settings = modeSettings[currentMode];
            const gapStart = Math.random() * (containerHeight - settings.pipeGap - 100) + 50;
            pipes.push({
                x: containerWidth,
                gapStart: gapStart,
                gapEnd: gapStart + settings.pipeGap,
                scored: false
            });
        }

        function gameLoop() {
            if (!gameRunning || gameOver) return;

            const settings = modeSettings[currentMode];

            cheeseVelocity += settings.gravity;
            cheeseY += cheeseVelocity;
            cheese.style.top = cheeseY + 'px';

            if (pipes.length === 0 || pipes[pipes.length - 1].x < 150) {
                createPipe();
            }

            pipes = pipes.filter(pipe => {
                pipe.x -= settings.pipeSpeed;
                
                const topPipe = document.createElement('div');
                topPipe.className = 'pipe pipe-top';
                topPipe.style.left = pipe.x + 'px';
                topPipe.style.height = pipe.gapStart + 'px';
                gameContainer.appendChild(topPipe);

                const bottomPipe = document.createElement('div');
                bottomPipe.className = 'pipe pipe-bottom';
                bottomPipe.style.left = pipe.x + 'px';
                bottomPipe.style.height = (containerHeight - pipe.gapEnd) + 'px';
                gameContainer.appendChild(bottomPipe);

                if (pipe.x < 60 && !pipe.scored) {
                    score++;
                    scoreDisplay.textContent = 'Score: ' + score;
                    pipe.scored = true;
                }

                if (60 + 50 > pipe.x && 60 < pipe.x + 70) {
                    if (cheeseY < pipe.gapStart || cheeseY + 50 > pipe.gapEnd) {
                        endGame();
                    }
                }

                return pipe.x > -70;
            });

            if (cheeseY < 0 || cheeseY > containerHeight - 50) {
                endGame();
            }

            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameRunning = false;
            gameOver = true;
            finalScoreDisplay.textContent = 'Score: ' + score;
            
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('cheeseBest', bestScore);
                bestScoreDisplay.textContent = 'Best: ' + bestScore;
            }
            bestScoreEndDisplay.textContent = 'Best: ' + bestScore;
            gameOverScreen.style.display = 'flex';
        }

        function resetGame() {
            cheeseY = 300;
            cheeseVelocity = 0;
            score = 0;
            scoreDisplay.textContent = 'Score: 0';
            gameOver = false;
            pipes = [];
            cheese.style.top = cheeseY + 'px';
            gameOverScreen.style.display = 'none';
            
            const allPipes = document.querySelectorAll('.pipe');
            allPipes.forEach(p => p.remove());
            
            countdownScreen.style.display = 'flex';
            startCountdown();
        }

        function backToMenu() {
            cheeseY = 300;
            cheeseVelocity = 0;
            score = 0;
            scoreDisplay.textContent = 'Score: 0';
            gameRunning = false;
            gameOver = false;
            pipes = [];
            cheese.style.top = cheeseY + 'px';
            gameOverScreen.style.display = 'none';
            modeSelectScreen.style.display = 'flex';
            currentModeDisplay.textContent = 'Mode: -';

            const allPipes = document.querySelectorAll('.pipe');
            allPipes.forEach(p => p.remove());
        }

        document.getElementById('noobBtn').addEventListener('click', () => selectMode('noob'));
        document.getElementById('easyBtn').addEventListener('click', () => selectMode('easy'));
        document.getElementById('normalBtn').addEventListener('click', () => selectMode('normal'));
        document.getElementById('hardBtn').addEventListener('click', () => selectMode('hard'));
        document.getElementById('superBtn').addEventListener('click', () => selectMode('superhardXtremedeluxe2000'));

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && gameRunning) {
                e.preventDefault();
                const settings = modeSettings[currentMode];
                cheeseVelocity = settings.jumpPower;
            }
        });

        gameContainer.addEventListener('click', () => {
            if (gameRunning) {
                const settings = modeSettings[currentMode];
                cheeseVelocity = settings.jumpPower;
            }
        });

        restartBtn.addEventListener('click', resetGame);
        backMenuBtn.addEventListener('click', backToMenu);
    </script>
</body>
</html>
